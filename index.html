<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Watching</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 6vh;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.35);
    pointer-events: none;
    transition: opacity 1.2s ease;
  }
  #hint.hidden {
    opacity: 0;
  }
  #blinkToggle {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease, opacity 0.3s ease;
  }
  #blinkToggle:hover {
    color: rgba(255, 255, 255, 0.8);
    border-color: rgba(255, 255, 255, 0.6);
  }
  #playBtn {
    position: fixed;
    left: 50%;
    bottom: 12vh;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #f2f2f2;
    background: rgba(255, 30, 30, 0.12);
    border: 1px solid rgba(255, 60, 60, 0.65);
    border-radius: 999px;
    padding: 11px 26px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  #playBtn:hover {
    background: rgba(255, 30, 30, 0.22);
  }
  #playBtn:active {
    transform: translateX(-50%) scale(0.96);
  }
  [hidden] {
    display: none !important;
  }
  #hud {
    position: fixed;
    top: max(20px, env(safe-area-inset-top));
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
  }
  #statusLabel {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.85);
    transition: color 0.15s ease;
  }
  #statusLabel.danger {
    color: #ff3b3b;
  }
  #scoreLabel {
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
    font-variant-numeric: tabular-nums;
  }
  #gameOverlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(2px);
  }
  #gameOverlay .panel {
    text-align: center;
    padding: 40px 44px;
  }
  #gameOverlay h1 {
    margin: 0 0 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: #ff3b3b;
    text-shadow: 0 0 22px rgba(255, 30, 30, 0.65);
  }
  #gameOverlay p {
    margin: 4px 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.6);
    font-variant-numeric: tabular-nums;
  }
  #gameOverlay .btnRow {
    margin-top: 26px;
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  #gameOverlay button {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 11px 24px;
    border-radius: 999px;
    cursor: pointer;
  }
  #retryBtn {
    color: #f2f2f2;
    background: rgba(255, 30, 30, 0.18);
    border: 1px solid rgba(255, 60, 60, 0.7);
  }
  #retryBtn:hover {
    background: rgba(255, 30, 30, 0.3);
  }
  #exitBtn {
    color: rgba(255, 255, 255, 0.6);
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.25);
  }
  #exitBtn:hover {
    color: rgba(255, 255, 255, 0.9);
    border-color: rgba(255, 255, 255, 0.6);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">move &middot; touch &middot; watch</div>
<button id="blinkToggle" type="button" aria-pressed="true">blink: on</button>
<button id="playBtn" type="button">&#9654; play: don't get caught</button>
<div id="hud" hidden>
  <div id="statusLabel">EYES CLOSED</div>
  <div id="scoreLabel">SCORE 0 &middot; BEST 0</div>
</div>
<div id="gameOverlay" hidden>
  <div class="panel">
    <h1>CAUGHT</h1>
    <p id="finalScore">Score: 0</p>
    <p id="finalBest">Best: 0</p>
    <div class="btnRow">
      <button id="retryBtn" type="button">retry</button>
      <button id="exitBtn" type="button">exit</button>
    </div>
  </div>
</div>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const blinkToggle = document.getElementById('blinkToggle');
  const playBtn = document.getElementById('playBtn');
  const hud = document.getElementById('hud');
  const statusLabel = document.getElementById('statusLabel');
  const scoreLabel = document.getElementById('scoreLabel');
  const gameOverlay = document.getElementById('gameOverlay');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');
  const retryBtn = document.getElementById('retryBtn');
  const exitBtn = document.getElementById('exitBtn');

  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  let eyes = [];
  let pairs = {};

  let blinkEnabled = localStorage.getItem('blinkEnabled') !== 'false';
  function updateBlinkToggle() {
    blinkToggle.textContent = 'blink: ' + (blinkEnabled ? 'on' : 'off');
    blinkToggle.setAttribute('aria-pressed', String(blinkEnabled));
  }
  updateBlinkToggle();
  blinkToggle.addEventListener('click', () => {
    blinkEnabled = !blinkEnabled;
    localStorage.setItem('blinkEnabled', String(blinkEnabled));
    updateBlinkToggle();
  });

  // pointer state
  let pointer = { x: 0, y: 0, active: false };
  let idleAngle = 0;

  // --- "Don't Get Caught" game state ---
  const CATCH_THRESHOLD = 16; // px of movement allowed during a danger phase
  const game = {
    state: 'menu', // 'menu' | 'safe' | 'danger' | 'gameover'
    score: 0,
    best: Number(localStorage.getItem('eyeGameBest') || 0),
    phaseEnd: 0,
    anchorX: 0,
    anchorY: 0,
    openAmt: 1
  };

  function safeDuration(score) {
    return Math.max(700, 2400 - score * 80) + Math.random() * 500;
  }
  function dangerDuration(score) {
    return Math.min(2600, 1000 + score * 60) + Math.random() * 400;
  }

  function setUiForMenu() {
    playBtn.hidden = false;
    blinkToggle.hidden = false;
    hud.hidden = true;
    gameOverlay.hidden = true;
  }
  function setUiForPlaying() {
    playBtn.hidden = true;
    blinkToggle.hidden = true;
    hud.hidden = false;
    gameOverlay.hidden = true;
  }
  function updateHud() {
    scoreLabel.textContent = 'SCORE ' + game.score + ' · BEST ' + game.best;
  }

  function startGame() {
    game.state = 'safe';
    game.score = 0;
    game.phaseEnd = performance.now() + 3000; // grace period to get oriented
    statusLabel.textContent = 'EYES CLOSED — MOVE FREELY';
    statusLabel.classList.remove('danger');
    updateHud();
    setUiForPlaying();
  }

  function triggerGameOver() {
    if (game.state !== 'safe' && game.state !== 'danger') return;
    game.state = 'gameover';
    if (game.score > game.best) {
      game.best = game.score;
      localStorage.setItem('eyeGameBest', String(game.best));
    }
    finalScore.textContent = 'Score: ' + game.score;
    finalBest.textContent = 'Best: ' + game.best;
    gameOverlay.hidden = false;
  }

  function exitToMenu() {
    game.state = 'menu';
    setUiForMenu();
  }

  playBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);
  exitBtn.addEventListener('click', exitToMenu);

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!pointer.active) {
      pointer.x = W / 2;
      pointer.y = H / 2;
    }
    buildGrid();
  }

  function buildGrid() {
    eyes = [];
    pairs = {};

    const eyeW = 46;   // eye width
    const eyeH = 30;   // eye height
    const withinPairGap = 14;  // gap between the two eyes in a pair
    const pairGap = 46;        // gap between pairs
    const rowGap = 20;         // vertical gap between rows

    const pairSpan = eyeW * 2 + withinPairGap;
    const groupSpan = pairSpan + pairGap;

    const cols = Math.max(1, Math.ceil((W + pairGap) / groupSpan));
    const rowSpan = eyeH + rowGap;
    const rows = Math.max(1, Math.ceil(H / rowSpan) + 1);

    const totalW = cols * groupSpan - pairGap;
    const offsetX = (W - totalW) / 2 + eyeW / 2;
    const totalH = rows * rowSpan - rowGap;
    const offsetY = (H - totalH) / 2 + eyeH / 2;

    let pairId = 0;
    for (let r = 0; r < rows; r++) {
      const cy = offsetY + r * rowSpan;
      for (let g = 0; g < cols; g++) {
        const groupX = offsetX + g * groupSpan;
        pairId++;
        pairs[pairId] = {
          nextBlink: performance.now() + Math.random() * 6000 + 500,
          blinkStart: 0,
          blinkDur: 220 + Math.random() * 80,
          blinking: false
        };
        for (let p = 0; p < 2; p++) {
          const cx = groupX + p * (eyeW + withinPairGap);
          eyes.push({
            x: cx,
            y: cy,
            w: eyeW,
            h: eyeH,
            pairId: pairId,
            redAmt: 0
          });
        }
      }
    }
  }

  function setPointer(x, y) {
    if (game.state === 'danger') {
      const dx = x - game.anchorX;
      const dy = y - game.anchorY;
      if (Math.hypot(dx, dy) > CATCH_THRESHOLD) {
        triggerGameOver();
      }
    }
    pointer.x = x;
    pointer.y = y;
    pointer.active = true;
    if (!hint.classList.contains('hidden')) hint.classList.add('hidden');
  }

  window.addEventListener('resize', resize);
  window.addEventListener('pointermove', (e) => setPointer(e.clientX, e.clientY), { passive: true });
  window.addEventListener('pointerdown', (e) => setPointer(e.clientX, e.clientY), { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  function findClosestPair(px, py) {
    let bestPair = null;
    let bestDist = Infinity;
    const centers = {};
    for (const eye of eyes) {
      if (!centers[eye.pairId]) centers[eye.pairId] = { sx: 0, sy: 0, n: 0 };
      const c = centers[eye.pairId];
      c.sx += eye.x; c.sy += eye.y; c.n++;
    }
    for (const id in centers) {
      const c = centers[id];
      const mx = c.sx / c.n, my = c.sy / c.n;
      const d = (mx - px) * (mx - px) + (my - py) * (my - py);
      if (d < bestDist) { bestDist = d; bestPair = Number(id); }
    }
    return bestPair;
  }

  function drawEye(eye, openAmt, px, py, redTarget) {
    const { x: cx, y: cy, w, h } = eye;
    const halfW = w / 2;
    const halfH = (h / 2) * openAmt;

    eye.redAmt += (redTarget - eye.redAmt) * 0.12;
    const red = eye.redAmt;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - halfW, cy);
    ctx.quadraticCurveTo(cx, cy - halfH * 1.5, cx + halfW, cy);
    ctx.quadraticCurveTo(cx, cy + halfH * 1.5, cx - halfW, cy);
    ctx.closePath();

    const glow = red * 14;
    if (glow > 0.5) {
      ctx.shadowColor = 'rgba(255,30,30,0.9)';
      ctx.shadowBlur = glow;
    }
    ctx.fillStyle = '#f2f2f2';
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

    if (openAmt < 0.18) return; // too closed to show a pupil

    // pupil direction toward gaze target, clamped inside the eye
    const dx = px - cx;
    const dy = py - cy;
    const dist = Math.hypot(dx, dy) || 1;
    const maxOffX = halfW * 0.58;
    const maxOffY = halfH * 0.58;
    const nx = dx / dist;
    const ny = dy / dist;
    const pupilX = cx + nx * maxOffX;
    const pupilY = cy + ny * maxOffY * (openAmt);

    const pupilR = Math.min(halfW, Math.max(halfH, 1)) * 0.5 * openAmt + 1.5;

    const black = [20, 20, 20];
    const redC = [255, 20, 20];
    const rr = black[0] + (redC[0] - black[0]) * red;
    const gg = black[1] + (redC[1] - black[1]) * red;
    const bb = black[2] + (redC[2] - black[2]) * red;

    ctx.save();
    ctx.beginPath();
    ctx.arc(pupilX, pupilY, pupilR, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${rr | 0}, ${gg | 0}, ${bb | 0})`;
    ctx.fill();
    ctx.restore();
  }

  function tickMenu(now) {
    let px = pointer.x, py = pointer.y;
    if (!pointer.active) {
      idleAngle += 0.006;
      px = W / 2 + Math.cos(idleAngle) * W * 0.28;
      py = H / 2 + Math.sin(idleAngle * 0.8) * H * 0.22;
    }

    const closestPair = findClosestPair(px, py);

    const openByPair = {};
    for (const id in pairs) {
      const pair = pairs[id];
      if (!blinkEnabled) {
        if (now > pair.nextBlink) pair.nextBlink = now + Math.random() * 7000 + 1500;
        pair.blinking = false;
        openByPair[id] = 1;
        continue;
      }
      if (!pair.blinking && now > pair.nextBlink) {
        pair.blinking = true;
        pair.blinkStart = now;
      }
      let openAmt = 1;
      if (pair.blinking) {
        const t = (now - pair.blinkStart) / pair.blinkDur;
        if (t >= 1) {
          pair.blinking = false;
          pair.nextBlink = now + Math.random() * 7000 + 1500;
          openAmt = 1;
        } else {
          openAmt = t < 0.5 ? 1 - (t / 0.5) : (t - 0.5) / 0.5;
        }
      }
      openByPair[id] = openAmt;
    }

    for (const eye of eyes) {
      const openAmt = openByPair[eye.pairId];
      const redTarget = eye.pairId === closestPair ? 1 : 0;
      drawEye(eye, openAmt, px, py, redTarget);
    }
  }

  function tickGame(now) {
    if (game.state === 'safe' || game.state === 'danger') {
      if (now > game.phaseEnd) {
        if (game.state === 'safe') {
          game.state = 'danger';
          game.anchorX = pointer.x;
          game.anchorY = pointer.y;
          game.phaseEnd = now + dangerDuration(game.score);
          statusLabel.textContent = "DON'T MOVE";
          statusLabel.classList.add('danger');
        } else {
          game.score++;
          updateHud();
          game.state = 'safe';
          game.phaseEnd = now + safeDuration(game.score);
          statusLabel.textContent = 'EYES CLOSED — MOVE FREELY';
          statusLabel.classList.remove('danger');
        }
      }
    }

    const openTarget = (game.state === 'safe') ? 0.08 : 1;
    game.openAmt += (openTarget - game.openAmt) * 0.3;

    const gazeX = (game.state === 'danger' || game.state === 'gameover') ? game.anchorX : pointer.x;
    const gazeY = (game.state === 'danger' || game.state === 'gameover') ? game.anchorY : pointer.y;
    const redTarget = (game.state === 'danger' || game.state === 'gameover') ? 1 : 0;

    for (const eye of eyes) {
      drawEye(eye, game.openAmt, gazeX, gazeY, redTarget);
    }
  }

  function tick(now) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    if (game.state === 'menu') {
      tickMenu(now);
    } else {
      tickGame(now);
    }

    requestAnimationFrame(tick);
  }

  resize();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
