<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Watching</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 6vh;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.35);
    pointer-events: none;
    transition: opacity 1.2s ease;
  }
  #hint.hidden {
    opacity: 0;
  }
  #blinkToggle {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  #blinkToggle:hover {
    color: rgba(255, 255, 255, 0.8);
    border-color: rgba(255, 255, 255, 0.6);
  }
  #blinkToggle:focus-visible {
    outline: 1px solid rgba(255, 60, 60, 0.8);
    outline-offset: 2px;
  }
  #densityControl {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    padding: 7px 14px 7px 16px;
  }
  #densityControl input[type="range"] {
    width: 90px;
    accent-color: #ff3b3b;
    cursor: pointer;
  }
  #soundToggle {
    position: fixed;
    bottom: max(16px, env(safe-area-inset-bottom));
    right: max(16px, env(safe-area-inset-right));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  #soundToggle:hover {
    color: rgba(255, 255, 255, 0.8);
    border-color: rgba(255, 255, 255, 0.6);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">move &middot; touch &middot; watch</div>
<button id="blinkToggle" type="button" aria-pressed="true">blink: on</button>
<button id="soundToggle" type="button" aria-pressed="false">sound: off</button>
<div id="densityControl">
  <label for="densitySlider">eyes</label>
  <input type="range" id="densitySlider" min="14" max="90" step="2" value="46" />
</div>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const blinkToggle = document.getElementById('blinkToggle');
  const densitySlider = document.getElementById('densitySlider');

  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  let eyes = [];
  let pairs = {};

  let blinkEnabled = localStorage.getItem('blinkEnabled') !== 'false';
  function updateBlinkToggle() {
    blinkToggle.textContent = 'blink: ' + (blinkEnabled ? 'on' : 'off');
    blinkToggle.setAttribute('aria-pressed', String(blinkEnabled));
  }
  updateBlinkToggle();
  blinkToggle.addEventListener('click', () => {
    blinkEnabled = !blinkEnabled;
    localStorage.setItem('blinkEnabled', String(blinkEnabled));
    updateBlinkToggle();
  });

  let eyeSize = Number(localStorage.getItem('eyeSize')) || 46;
  densitySlider.value = String(eyeSize);
  densitySlider.addEventListener('input', () => {
    eyeSize = Number(densitySlider.value);
    localStorage.setItem('eyeSize', String(eyeSize));
    buildGrid();
  });

  // --- generative beat: a soft kick + hat + drone, synthesized live ---
  const soundToggle = document.getElementById('soundToggle');
  let soundEnabled = false;
  let audioCtx = null;
  let masterGain = null;
  let padGain = null;
  let schedulerId = null;
  let nextNoteTime = 0;
  let beatCount = 0;
  const BPM = 84;
  const beatSec = 60 / BPM;
  const beatTimes = []; // recent scheduled beat times, mapped to performance.now() ms, for the visual wave

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.55;
    masterGain.connect(audioCtx.destination);

    const pad = audioCtx.createOscillator();
    pad.type = 'sine';
    pad.frequency.value = 55;
    const padFilter = audioCtx.createBiquadFilter();
    padFilter.type = 'lowpass';
    padFilter.frequency.value = 260;
    padGain = audioCtx.createGain();
    padGain.gain.value = 0.0001;
    pad.connect(padFilter).connect(padGain).connect(masterGain);
    pad.start();

    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.08;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.025;
    lfo.connect(lfoGain).connect(padGain.gain);
    lfo.start();
  }

  function playKick(time) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.exponentialRampToValueAtTime(42, time + 0.16);
    gain.gain.setValueAtTime(0.001, time);
    gain.gain.exponentialRampToValueAtTime(0.9, time + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
    osc.connect(gain).connect(masterGain);
    osc.start(time);
    osc.stop(time + 0.32);
  }

  function playHat(time, vel) {
    const bufferSize = Math.floor(audioCtx.sampleRate * 0.04);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 7000;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vel, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
    noise.connect(hp).connect(gain).connect(masterGain);
    noise.start(time);
  }

  function scheduleBeat(beatNum, time) {
    playKick(time);
    if (beatNum % 2 === 1) playHat(time + beatSec * 0.5, 0.12);
    const perfTime = performance.now() + (time - audioCtx.currentTime) * 1000;
    beatTimes.push(perfTime);
    while (beatTimes.length > 6) beatTimes.shift();
  }

  function schedulerTick() {
    while (nextNoteTime < audioCtx.currentTime + 0.15) {
      scheduleBeat(beatCount, nextNoteTime);
      nextNoteTime += beatSec;
      beatCount++;
    }
  }

  function startSound() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    nextNoteTime = audioCtx.currentTime + 0.05;
    beatCount = 0;
    if (schedulerId) clearInterval(schedulerId);
    schedulerId = setInterval(schedulerTick, 25);
    padGain.gain.setTargetAtTime(0.06, audioCtx.currentTime, 0.8);
  }

  function stopSound() {
    if (schedulerId) { clearInterval(schedulerId); schedulerId = null; }
    if (padGain) padGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.3);
  }

  function updateSoundToggle() {
    soundToggle.textContent = 'sound: ' + (soundEnabled ? 'on' : 'off');
    soundToggle.setAttribute('aria-pressed', String(soundEnabled));
  }
  soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    updateSoundToggle();
    if (soundEnabled) startSound(); else stopSound();
  });

  // pointer state
  let pointer = { x: 0, y: 0, active: false };
  let idleAngle = 0;

  function resize() {
    // mobile browsers can report a window.innerHeight taller than what's
    // actually visible (collapsible address bar), so prefer the visualViewport
    // when available - keeps the grid, and the gaze target, matched to what's
    // really on screen instead of extending below the fold.
    const vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!pointer.active) {
      pointer.x = W / 2;
      pointer.y = H / 2;
    }
    buildGrid();
  }

  function buildGrid() {
    eyes = [];
    pairs = {};
    activePairId = null;

    const eyeW = eyeSize;                    // eye width
    const eyeH = eyeSize * (30 / 46);        // eye height
    const withinPairGap = eyeSize * (16 / 46); // gap between every eye in a row (kept uniform)
    const pairGap = withinPairGap;
    const rowGap = eyeSize * (4 / 46);       // vertical gap between rows

    const pairSpan = eyeW * 2 + withinPairGap;
    const groupSpan = pairSpan + pairGap;

    const cols = Math.max(1, Math.ceil((W + pairGap) / groupSpan));
    const rowSpan = eyeH + rowGap;
    const rows = Math.max(1, Math.ceil(H / rowSpan) + 1);

    const totalW = cols * groupSpan - pairGap;
    const offsetX = (W - totalW) / 2 + eyeW / 2;
    const totalH = rows * rowSpan - rowGap;
    const offsetY = (H - totalH) / 2 + eyeH / 2;

    let pairId = 0;
    for (let r = 0; r < rows; r++) {
      const cy = offsetY + r * rowSpan;
      for (let g = 0; g < cols; g++) {
        const groupX = offsetX + g * groupSpan;
        pairId++;
        pairs[pairId] = {
          nextBlink: performance.now() + Math.random() * 6000 + 500,
          blinkStart: 0,
          blinkDur: 220 + Math.random() * 80,
          blinking: false
        };
        for (let p = 0; p < 2; p++) {
          const cx = groupX + p * (eyeW + withinPairGap);
          eyes.push({
            x: cx,
            y: cy,
            w: eyeW,
            h: eyeH,
            pairId: pairId,
            redAmt: 0
          });
        }
      }
    }
  }

  function setPointer(x, y) {
    pointer.x = x;
    pointer.y = y;
    pointer.active = true;
    if (!hint.classList.contains('hidden')) hint.classList.add('hidden');
  }

  window.addEventListener('resize', resize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('pointermove', (e) => setPointer(e.clientX, e.clientY), { passive: true });
  window.addEventListener('pointerdown', (e) => setPointer(e.clientX, e.clientY), { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  let activePairId = null; // sticky selection, see findClosestPair below

  function findClosestPair(px, py) {
    let bestPair = null;
    let bestDist = Infinity;
    let bestX = px, bestY = py;
    const centers = {};
    for (const eye of eyes) {
      if (!centers[eye.pairId]) centers[eye.pairId] = { sx: 0, sy: 0, n: 0 };
      const c = centers[eye.pairId];
      c.sx += eye.x; c.sy += eye.y; c.n++;
    }
    for (const id in centers) {
      const c = centers[id];
      const mx = c.sx / c.n, my = c.sy / c.n;
      const d = (mx - px) * (mx - px) + (my - py) * (my - py);
      if (d < bestDist) { bestDist = d; bestPair = Number(id); bestX = mx; bestY = my; }
    }

    // hysteresis: when the wandering point sits almost equidistant between two
    // pairs, don't flicker between them every frame - only steal the highlight
    // when a candidate is meaningfully closer than the currently active pair.
    if (activePairId != null && centers[activePairId] && activePairId !== bestPair) {
      const c = centers[activePairId];
      const mx = c.sx / c.n, my = c.sy / c.n;
      const curDist = (mx - px) * (mx - px) + (my - py) * (my - py);
      if (bestDist > curDist * 0.55) {
        bestPair = activePairId;
        bestX = mx;
        bestY = my;
      }
    }
    activePairId = bestPair;

    return { id: bestPair, x: bestX, y: bestY };
  }

  // how strongly the beat-wave ring touches a point at (ex, ey) at time `now` (ms)
  const WAVE_DURATION_MS = beatSec * 1600;
  function waveGlowAt(ex, ey, now, originX, originY, maxRadius) {
    let amt = 0;
    for (let i = beatTimes.length - 1; i >= 0; i--) {
      const dt = now - beatTimes[i];
      if (dt < 0) continue;
      const phase = dt / WAVE_DURATION_MS;
      if (phase > 1.15) break;
      const ringR = phase * maxRadius;
      const dist = Math.hypot(ex - originX, ey - originY);
      const proximity = Math.exp(-((dist - ringR) ** 2) / (2 * 60 * 60));
      const fade = Math.max(0, 1 - phase);
      const contribution = proximity * fade;
      if (contribution > amt) amt = contribution;
    }
    return amt;
  }

  function drawEye(eye, openAmt, px, py, redTarget, wave) {
    const { x: cx, y: cy, w, h } = eye;
    const halfW = w / 2;
    const halfH = (h / 2) * openAmt;

    eye.redAmt += (redTarget - eye.redAmt) * 0.12;
    const red = eye.redAmt;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - halfW, cy);
    ctx.quadraticCurveTo(cx, cy - halfH * 1.5, cx + halfW, cy);
    ctx.quadraticCurveTo(cx, cy + halfH * 1.5, cx - halfW, cy);
    ctx.closePath();

    const redGlow = red * 14;
    const waveGlow = wave * 16;
    if (redGlow > waveGlow && redGlow > 0.5) {
      ctx.shadowColor = 'rgba(255,30,30,0.9)';
      ctx.shadowBlur = redGlow;
    } else if (waveGlow > 0.5) {
      ctx.shadowColor = 'rgba(255,255,255,0.8)';
      ctx.shadowBlur = waveGlow;
    }
    ctx.fillStyle = '#f2f2f2';
    ctx.fill();
    ctx.shadowBlur = 0;

    if (openAmt >= 0.18) {
      // clip the pupil to the eye's own outline so it can be drawn large
      // without ever spilling past the eye's corners
      ctx.clip();

      const dx = px - cx;
      const dy = py - cy;
      const dist = Math.hypot(dx, dy) || 1;
      // NOTE: the lens shape tapers to a point at +-halfW and its actual peak
      // height is only ~0.75*halfH (from the quadratic curve control points),
      // so these must stay well inside those bounds - otherwise the pupil
      // circle lands entirely outside the clip path and vanishes.
      const maxOffX = halfW * 0.7;
      const maxOffY = halfH * 0.6;
      const nx = dx / dist;
      const ny = dy / dist;
      // as an eye turns red it locks its gaze dead ahead, staring straight at you
      const trackAmt = 1 - red;
      const pupilX = cx + nx * maxOffX * trackAmt;
      const pupilY = cy + ny * maxOffY * openAmt * trackAmt;

      const pupilR = Math.min(halfW, Math.max(halfH, 1)) * 0.42 * openAmt + 1.5;

      const black = [20, 20, 20];
      const redC = [255, 20, 20];
      const rr = black[0] + (redC[0] - black[0]) * red;
      const gg = black[1] + (redC[1] - black[1]) * red;
      const bb = black[2] + (redC[2] - black[2]) * red;

      ctx.beginPath();
      ctx.arc(pupilX, pupilY, pupilR, 0, Math.PI * 2);
      ctx.fillStyle = `rgb(${rr | 0}, ${gg | 0}, ${bb | 0})`;
      ctx.fill();
    }

    ctx.restore();
  }

  function tick(now) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    let px = pointer.x, py = pointer.y;
    if (!pointer.active) {
      idleAngle += 0.006;
      px = W / 2 + Math.cos(idleAngle) * W * 0.28;
      py = H / 2 + Math.sin(idleAngle * 0.8) * H * 0.22;
    }

    const closest = findClosestPair(px, py);
    const closestPair = closest.id;
    const maxRadius = Math.hypot(W, H) * 0.6;

    const openByPair = {};
    for (const id in pairs) {
      const pair = pairs[id];
      if (!blinkEnabled) {
        // keep the schedule from backing up so blinking resumes smoothly when re-enabled
        if (now > pair.nextBlink) pair.nextBlink = now + Math.random() * 7000 + 1500;
        pair.blinking = false;
        openByPair[id] = 1;
        continue;
      }
      if (!pair.blinking && now > pair.nextBlink) {
        pair.blinking = true;
        pair.blinkStart = now;
      }
      let openAmt = 1;
      if (pair.blinking) {
        const t = (now - pair.blinkStart) / pair.blinkDur;
        if (t >= 1) {
          pair.blinking = false;
          pair.nextBlink = now + Math.random() * 7000 + 1500;
          openAmt = 1;
        } else {
          openAmt = t < 0.5 ? 1 - (t / 0.5) : (t - 0.5) / 0.5;
        }
      }
      openByPair[id] = openAmt;
    }

    for (const eye of eyes) {
      const openAmt = openByPair[eye.pairId];
      const redTarget = eye.pairId === closestPair ? 1 : 0;
      const wave = soundEnabled ? waveGlowAt(eye.x, eye.y, now, closest.x, closest.y, maxRadius) : 0;
      // gaze target is the red pair's own midpoint, not the raw pointer/wander
      // point, so every eye converges on exactly where the red eyes visually are
      drawEye(eye, openAmt, closest.x, closest.y, redTarget, wave);
    }

    requestAnimationFrame(tick);
  }

  resize();
  // mobile address bars can still be settling their collapsed/expanded state
  // right after load - one more pass shortly after catches that
  setTimeout(resize, 300);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
